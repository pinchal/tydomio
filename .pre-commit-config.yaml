ci:
  skip: [pylint]
  autofix_prs: true
  autoupdate_schedule: quarterly

default_language_version:
  python: python3.14

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: name-tests-test
    -   id: requirements-txt-fixer
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
    -   id: pyupgrade
        args: [--py314-plus]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.1'
    hooks:
    -   id: mypy
        args: [--strict]
        additional_dependencies: [httpx>=0.28.1, pydantic>=2.12, websockets>=14]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [--fix]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    - id: pylint
      name: pylint
      entry: uv run pylint
      language: system
      types: [python]
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
          "--rcfile=pyproject.toml",
        ]
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.13.6
  hooks:
    - id: uv-lock
