[project]
name = "tydomio"
version = "0.0.1"
description = "Async client API"
authors = [
    {name = "Stéphane Pinchaux", email = "stephane@ggwp.me"},
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-core>=2.50.2",
    "websockets>=14",
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "GPL3"}
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "coverage>=7.17",
  "datamodel-code-generator>=0.87",
  "pre-commit>=4.7",
  "pylint>=4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
]

[tool.uv]
package = true

[project.scripts]
tydomio-cli = "tydomio.cli:main"
tydomio-capture = "tydomio.capture.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tydomio"]
# thin adapters to the real network, the only code tests never run
omit = ["tydomio/network.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "PYI", # flake8-pyi
    "UP", # pyupgrade
    "RUF", # ruff
    "S",  # flake8-bandit (security)
    "W",  # pycodestyle
    "PIE", # flake8-pie
    "PGH004", # pygrep-hooks - Use specific rule codes when using noqa
    "PLE", # pylint error
    "PLW", # pylint warning
    "PLC", # pylint convention
    "PLR", # pylint refactor
]
ignore = [
    "D203", # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
    "D213", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
    "PLR0913", # nope, I don't realy have too many arguments in my constructor
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest asserts with `assert`
    "D100", # a test module is described by its name
    "D103", # a test is described by its name
    "PLR2004", # expected values are the test data, a constant would only rename them
]

[tool.pylint.main]
py-version=3.14

# pylint only runs the checks ruff and ty miss.
[tool.pylint."messages control"]
disable = ["all"]
enable = [
    # class design and inheritance, beyond ruff and ty
    "abstract-method",
    "access-member-before-definition",
    "arguments-differ",
    "arguments-renamed",
    "attribute-defined-outside-init",
    "invalid-overridden-method",
    "method-hidden",
    "non-parent-init-called",
    "signature-differs",
    "super-init-not-called",
    "unused-private-member",
    "useless-parent-delegation",
    # whole project
    "cyclic-import",
    "duplicate-code",
    # inference ruff does not do
    "redefined-outer-name",
    "protected-access",
    "undefined-loop-variable",
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",
    "consider-using-with",
    "contextmanager-generator-missing-cleanup",
    "broad-exception-caught",
    # complexity metrics, preview only in ruff
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-boolean-expressions",
    "too-many-public-methods",
    "too-many-ancestors",
]

[tool.ty.rules]
all = "error"
